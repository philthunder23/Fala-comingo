:root{
  /* Layout: eine schmale Spalte, Navigation unten am Daumen, nur große Tippflächen, kein Tippen von Text */
  --bg:#eef2fa; --surface:#ffffff; --ink:#14213d; --muted:#56627f; --line:#d5ddef;
  --azul:#1f4fb8; --azul-ink:#ffffff; --azul-soft:#e0e8fb; --sol:#e3a21a;
  --ok:#14804e; --ok-soft:#dcf3e7; --bad:#c2352b; --bad-soft:#fbe4e1;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1322; --surface:#151f37; --ink:#e7ecf7; --muted:#9ba7c3; --line:#28365c;
    --azul:#86a5ff; --azul-ink:#0c1322; --azul-soft:#1d2b52; --sol:#f2c35b;
    --ok:#4cc58f; --ok-soft:#133a28; --bad:#ff8174; --bad-soft:#401c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#151f37; --ink:#e7ecf7; --muted:#9ba7c3; --line:#28365c;
  --azul:#86a5ff; --azul-ink:#0c1322; --azul-soft:#1d2b52; --sol:#f2c35b;
  --ok:#4cc58f; --ok-soft:#133a28; --bad:#ff8174; --bad-soft:#401c19;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
.tile{width:38px;height:38px;border-radius:9px;flex:none;border:2px solid var(--azul);
  background:
    radial-gradient(circle at 50% 50%, var(--azul) 0 18%, transparent 19%),
    radial-gradient(circle at 0 0, var(--azul) 0 22%, transparent 23%),
    radial-gradient(circle at 100% 0, var(--azul) 0 22%, transparent 23%),
    radial-gradient(circle at 0 100%, var(--azul) 0 22%, transparent 23%),
    radial-gradient(circle at 100% 100%, var(--azul) 0 22%, transparent 23%),
    conic-gradient(from 45deg, var(--azul-soft) 0 25%, var(--surface) 0 50%, var(--azul-soft) 0 75%, var(--surface) 0)}
.brand{flex:1;min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.1}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{background:var(--azul-soft);color:var(--azul);border-radius:999px;padding:6px 11px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gear{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.banner{margin:0 16px 6px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner[hidden]{display:none}
.banner button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:0 4px;min-height:28px}

main{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--azul);font-weight:700}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--azul-soft);border-radius:13px;padding:4px;gap:4px;margin-top:6px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;font-size:15px;padding:4px 6px;line-height:1.15}
.seg button.on{background:var(--surface);color:var(--azul);font-weight:700;box-shadow:0 1px 3px rgba(10,20,50,.15)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;min-height:42px;display:flex;align-items:center;gap:6px}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--azul);border-color:var(--azul);color:var(--azul-ink)}
.chip.on .n{color:inherit;opacity:.8}

.stage{position:relative;height:min(50vh,360px);min-height:270px;margin-top:12px}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 30px -16px rgba(20,33,61,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 22px 40px;text-align:center;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .25s ease, opacity .25s ease;cursor:pointer}
.card .cat{position:absolute;top:16px;left:18px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lvl{position:absolute;top:18px;right:18px;display:flex;gap:4px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvl i.f{background:var(--ok)}
.word{font-size:clamp(26px,7.5vw,36px);line-height:1.15;text-wrap:balance;font-weight:700}
.word.pt,.prompt.pt{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px)}
.back{display:none;margin-top:14px}
.card.flipped .back{display:block}
.trans{font-size:22px;text-wrap:balance}
.trans.pt{font-family:var(--display);font-size:clamp(28px,8vw,38px);color:var(--azul)}
.note{font-size:15px;color:var(--muted);margin:10px auto 0;max-width:34ch;border-top:1px solid var(--line);padding-top:10px}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:13px;color:var(--muted)}
.say{width:58px;height:58px;border-radius:50%;border:0;background:var(--azul-soft);color:var(--azul);display:grid;place-items:center;margin-top:14px;flex:none}
.say svg{width:28px;height:28px}
.say.sm{width:48px;height:48px;margin-top:4px}
.swl{position:absolute;top:46px;left:50%;transform:translateX(-50%) rotate(-6deg);padding:4px 12px;border-radius:9px;border:2.5px solid;font-weight:700;font-size:16px;opacity:0;pointer-events:none;background:var(--surface)}
.swl.l{color:var(--bad);border-color:var(--bad)}
.swl.r{color:var(--ok);border-color:var(--ok)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.btn{min-height:58px;border-radius:15px;border:0;font-weight:700;font-size:17px;width:100%}
.btn.again{background:var(--bad-soft);color:var(--bad)}
.btn.know{background:var(--ok-soft);color:var(--ok)}
.btn.primary{background:var(--azul);color:var(--azul-ink)}
.btn.quiet{background:var(--azul-soft);color:var(--azul)}
.tip{font-size:14px;color:var(--muted);margin:12px 2px 0;text-align:center}
.lead{font-size:15px;color:var(--muted);margin:8px 2px 0}

.score{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:10px 2px 0;font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;text-align:center;margin-top:8px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.q .lbl{font-size:14px;color:var(--muted)}
.prompt{font-size:clamp(24px,7vw,32px);font-weight:700;line-height:1.15;text-wrap:balance}
.prompt .pron{color:var(--azul);font-family:var(--display);font-weight:400}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--line);margin-left:.25em}
.hidden{visibility:hidden}
.play{border:0;border-radius:999px;background:var(--azul);color:var(--azul-ink);display:flex;align-items:center;gap:10px;padding:12px 22px 12px 16px;font-weight:700;min-height:56px}
.play svg{width:26px;height:26px}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:60px;text-align:left;padding:10px 14px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;display:flex;align-items:center;gap:12px;transition:background .15s,border-color .15s}
.opts.two .opt{justify-content:center;text-align:center;font-family:var(--display);font-size:22px}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--azul-soft);color:var(--azul);font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.after{margin-top:12px;display:grid;gap:10px}
.after .note{margin:0;max-width:none;border:0;padding:0;text-align:center}

.conj{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-top:12px}
.conj span{padding:3px 0}
.conj .p{color:var(--muted)}
.conj .f{font-family:var(--display);font-size:19px}
.conj .hl{color:var(--azul)}

.list{display:grid;gap:10px;margin-top:10px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.ph:active{background:var(--azul-soft)}
.ph .t{flex:1;min-width:0}
.ph .pt{font-size:19px;font-weight:700}
.ph .de{color:var(--muted);margin-top:2px}
.ph .nt{font-size:14px;color:var(--muted);margin-top:7px;border-left:3px solid var(--sol);padding-left:8px}
.slow{flex:none;width:58px;min-height:56px;border:0;border-radius:13px;background:var(--azul-soft);color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700}
.slow svg{width:22px;height:22px}

.scrim{position:fixed;inset:0;background:rgba(8,14,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;display:grid;gap:16px;z-index:10;max-height:90%;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.set{display:grid;gap:8px}
.set .t{font-weight:700;font-size:15px}
.set .d{font-size:14px;color:var(--muted)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;padding:6px 0;min-height:48px;text-align:left;width:100%}
.tog .ui{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog .ui::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tog[aria-checked="true"] .ui{background:var(--ok)}
.tog[aria-checked="true"] .ui::after{left:23px}
.voice{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--azul-soft)}
.voice.warn{background:var(--bad-soft)}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
@media (min-height:760px){ .stage{height:400px} }
</style>
</head>

</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
let timer = null;

function pool(){ const p = W.filter(w=>S.cats.includes(w[2])); return p.length ? p : W; }
function pick(arr,last){
 const a = arr.length>1 ? arr.filter(w=>w[0]!==last) : arr;
 const ws = a.map(w=>1/Math.pow(1+(S.box[w[0]]||0),1.7));
 let r = Math.random()*ws.reduce((x,y)=>x+y,0);
 for(let i=0;i<a.length;i++){ r-=ws[i]; if(r<=0) return a[i]; }
 return a[a.length-1];
}
function grade(id,ok){
 const b = S.box[id]||0;
 S.box[id] = ok ? Math.min(5,b+1) : 0;
 S.today.total++; if(ok) S.today.right++;
 save(); renderStat();
}
const mastered = list => list.filter(w=>(S.box[w[0]]||0)>=3).length;
function renderStat(){ $("stat").innerHTML = `<b>${mastered(W)}</b>/${W.length} sicher`; }

/* ---------- Sprachausgabe ---------- */
let voice=null, voiceState="loading", bannerClosed=store.get("bannerClosed",false);
function loadVoices(final){
 if(!("speechSynthesis" in window)){ voiceState="unsupported"; renderVoice(); return; }
 const vs = speechSynthesis.getVoices();
 const norm = v => v.lang.replace("_","-").toLowerCase();
 const pt = vs.filter(v=>norm(v)==="pt-pt");
 if(pt.length){ voice = pt.find(v=>/joana|catarina|ines|inês|duarte|cristiano/i.test(v.name)) || pt[0]; voiceState="pt"; }
 else { const any = vs.find(v=>norm(v).startsWith("pt")); if(any){ voice=any; voiceState="br"; } else voiceState = (vs.length||final) ? "none" : "loading"; }
 renderVoice();
}
function speak(t,slow){
 if(!("speechSynthesis" in window)) return;
 const txt = t.replace(/\(.*?\)/g,"").replace(/…/g,"").replace(/\s\/\s/g,", ").trim();
 try{
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "pt-PT"; if(voice) u.voice = voice;
  u.rate = slow ? 0.6 : S.rate;
  speechSynthesis.speak(u);
 }catch(e){}
}
function voiceText(){
 if(voiceState==="pt") return {warn:false, t:`Stimme: ${esc(voice.name)} (Portugal). Passt.`};
 if(voiceState==="br") return {warn:true, t:"Auf deinem Gerät ist nur eine brasilianische Stimme. Lade in den Handy-Einstellungen unter Sprachausgabe bzw. Gesprochene Inhalte die Stimme „Portugiesisch (Portugal)“ und öffne die App neu."};
 if(voiceState==="none") return {warn:true, t:"Keine portugiesische Stimme gefunden. Lade in den Handy-Einstellungen unter Sprachausgabe die Stimme „Portugiesisch (Portugal)“."};
 if(voiceState==="unsupported") return {warn:true, t:"Dieser Browser kann nicht vorlesen. Öffne die App in Safari oder Chrome."};
 return {warn:false, t:"Stimme wird gesucht …"};
}
function renderVoice(){
 const v = voiceText();
 const el = $("voiceinfo"); if(el){ el.className = "voice"+(v.warn?" warn":""); el.innerHTML = v.t; }
 const b = $("banner");
 if(v.warn && !bannerClosed){ b.hidden=false; b.innerHTML = `<span style="flex:1">${v.t}</span><button data-act="banner" aria-label="Hinweis schließen">OK</button>`; }
 else b.hidden = true;
}

let cur=null, flipped=false, lastCard=null, busy=false;
function viewKarten(){
 $("main").innerHTML = `
  <div class="seg" role="group" aria-label="Richtung">${segBtn("dir","pt","Portugiesisch zuerst")}${segBtn("dir","de","Deutsch zuerst")}</div>
  ${catChips()}

  <p class="tip">Antippen dreht die Karte um. Wisch nach rechts, wenn du sie kannst, nach links für nochmal.</p>`;
 bindCard(); nextCard();
}
function nextCard(){
 cur = pick(pool(), lastCard); lastCard = cur[0]; flipped=false; drawCard();
 if(S.auto && S.dir==="pt") speak(cur[0]);
}
function drawCard(){
 const c=$("card"); if(!c) return;
 const [pt,de,cat,note]=cur, b=S.box[pt]||0, ptFirst=S.dir==="pt";
 c.className = "card"+(flipped?" flipped":"");
 c.style.transition="none"; c.style.transform=""; c.style.opacity="";
 c.innerHTML = `<span class="cat">${CATS[cat]}</span>
  <span class="lvl" aria-label="Stufe ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"f":""}"></i>`).join("")}</span>
  <div class="word ${ptFirst?"pt":""}">${esc(ptFirst?pt:de)}</div>
  <div class="back"><div class="trans ${ptFirst?"":"pt"}">${esc(ptFirst?de:pt)}</div>${note?`<div class="note">${esc(note)}</div>`:""}</div>
  ${(ptFirst||flipped)?`<button class="say" data-act="say" aria-label="Vorlesen">${ICON.speaker}</button>`:""}
  <div class="hint">${flipped?"":"Antippen zum Umdrehen"}</div>
  <div class="swl l">Nochmal</div><div class="swl r">Kann ich</div>`;
 void c.offsetWidth; c.style.transition="";
}
function flip(){ flipped=!flipped; drawCard(); if(flipped && S.dir==="de" && S.auto) speak(cur[0]); }
function answer(ok){
 if(busy) return; busy=true;
 grade(cur[0],ok); buzz(ok?18:[40,30,40]);
 const c=$("card");
 c.style.transition="transform .22s ease, opacity .22s ease";
 c.style.transform=`translateX(${ok?130:-130}%) rotate(${ok?14:-14}deg)`; c.style.opacity="0";
 setTimeout(()=>{ busy=false; refreshChips(); nextCard(); },210);
}
function bindCard(){
 const c=$("card"); let sx=0, dx=0, down=false;
 const labels = () => [c.querySelector(".swl.l"), c.querySelector(".swl.r")];
 c.addEventListener("pointerdown",e=>{
  if(e.target.closest(".say")||busy) return;
  down=true; sx=e.clientX; dx=0; c.style.transition="none";
  try{ c.setPointerCapture(e.pointerId); }catch(_){}
 });
 c.addEventListener("pointermove",e=>{
  if(!down) return; dx=e.clientX-sx;
  c.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;
  const [l,r]=labels(); if(l){ l.style.opacity=Math.min(1,Math.max(0,-dx/90)); r.style.opacity=Math.min(1,Math.max(0,dx/90)); }
 });
 const end=()=>{
  if(!down) return; down=false; c.style.transition="";
  if(dx>90) answer(true);
  else if(dx<-90) answer(false);
  else { c.style.transform=""; const [l,r]=labels(); if(l){l.style.opacity=0;r.style.opacity=0;} if(Math.abs(dx)<8) flip(); }
 };
 c.addEventListener("pointerup",end);
 c.addEventListener("pointercancel",()=>{ down=false; c.style.transition=""; c.style.transform=""; });
 c.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); }
  if(e.key==="ArrowRight") answer(true);
  if(e.key==="ArrowLeft") answer(false);
 });
}

let qa=null, lastQ=null, streak=0;
function viewQuiz(){
 $("main").innerHTML = `
  <div class="seg" role="group" aria-label="Art">${segBtn("qmode","de2pt","Deutsch → PT")}${segBtn("qmode","pt2de","PT → Deutsch")}${segBtn("qmode","listen","Hören")}</div>

function renderScore(el){ const t=S.today; $(el).innerHTML = `<span>Serie <b>${streak}</b></span><span>Heute <b>${t.right}</b> von ${t.total} richtig</span>`; }
function nextQ(){
 clearTimeout(timer);
 const item = pick(pool(), lastQ); lastQ=item[0];
 const ai = S.qmode==="de2pt" ? 0 : 1, ans = item[ai];
 let c = W.filter(w=>w[2]===item[2] && w[ai]!==ans);
 if(c.length<3) c = W.filter(w=>w[ai]!==ans);
 const d=[]; for(const w of shuffle(c)){ if(!d.includes(w[ai])) d.push(w[ai]); if(d.length===3) break; }
 qa = {item, ans, opts:shuffle([ans,...d]), done:false};
 const [pt,de]=item;
 let q;
 if(S.qmode==="de2pt") q = `<div class="lbl">Wie sagt man auf Portugiesisch?</div><div class="prompt">${esc(de)}</div>`;
 else if(S.qmode==="pt2de") q = `<div class="lbl">Was heißt das?</div><div class="prompt pt">${esc(pt)}</div><button class="say sm" data-act="sayq" aria-label="Vorlesen">${ICON.speaker}</button>`;
 else q = `<div class="lbl">Hör zu. Was heißt das?</div><button class="play" data-act="sayq">${ICON.speaker}<span>Nochmal hören</span></button><div class="prompt pt hidden" id="reveal">${esc(pt)}</div>`;
 $("q").innerHTML = q;
 $("opts").className = "opts";
 $("opts").innerHTML = qa.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("");
 $("after").innerHTML = "";
 renderScore("score");
 if(S.qmode==="listen" || (S.qmode==="pt2de" && S.auto)) speak(pt);
}
function chooseQ(i){
 if(!qa||qa.done) return; qa.done=true;
 const ok = qa.opts[i]===qa.ans;
 document.querySelectorAll("#opts .opt").forEach((b,j)=>{
  if(qa.opts[j]===qa.ans) b.classList.add("right");
  else if(j===i) b.classList.add("wrong"); else b.classList.add("dim");
 });
 grade(qa.item[0],ok); streak = ok ? streak+1 : 0; buzz(ok?18:[40,30,40]);
 const r=$("reveal"); if(r) r.classList.remove("hidden");
 if(S.qmode==="de2pt") speak(qa.item[0]);
 renderScore("score");
 if(ok){ timer=setTimeout(()=>{ refreshChips(); nextQ(); },1100); }
 else {
  const [pt,de,,note]=qa.item;
  $("after").innerHTML = `<div class="note"><b>${esc(pt)}</b> = ${esc(de)}${note?`<br>${esc(note)}`:""}</div><button class="btn primary" data-act="nextq">Weiter</button>`;
 }
}

 do{ v=V[Math.floor(Math.random()*V.length)]; pi=Math.floor(Math.random()*5); key=v[0]+pi; }while(key===lastV);
 lastV=key;
 const ans=v[2][pi];

 vq = {v, pi, ans, opts:shuffle([ans,...others]), done:false};

  else if(j===i) b.classList.add("wrong"); else b.classList.add("dim");
 });
 vtotal++; if(ok){ vright++; vstreak++; } else vstreak=0;
 buzz(ok?18:[40,30,40]);

 if(ok) timer=setTimeout(nextV,1700);
}

}
function openSheet(o){ $("sheet").classList.toggle("open",o); $("scrim").classList.toggle("open",o); if(o) renderSettings(); }

/* ---------- Steuerung ---------- */
const VIEWS = {karten:viewKarten, quiz:viewQuiz, saetze:viewSaetze, verben:viewVerben};
function setTab(t){
 clearTimeout(timer); if(!VIEWS[t]) t="karten"; S.tab=t; save();
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
 $("main").scrollTop=0; VIEWS[t]();
}
document.addEventListener("click",e=>{
 const el = e.target.closest("[data-act]"); if(!el) return;
 const a = el.dataset.act, i = +el.dataset.i;
 switch(a){
  case "tab": setTab(el.dataset.tab); break;
  case "set": {
   let v = el.dataset.v; if(el.dataset.k==="rate") v=parseFloat(v);
   S[el.dataset.k]=v; save();
   if(el.dataset.k==="rate"){ renderSettings(); speak("Olá, tudo bem?"); } else VIEWS[S.tab]();
   break; }
  case "allcats": S.cats=Object.keys(CATS); save(); VIEWS[S.tab](); break;
  case "cat": {
   const k=el.dataset.c, all=S.cats.length===Object.keys(CATS).length;
   if(all) S.cats=[k];
   else if(S.cats.includes(k)) S.cats=S.cats.filter(x=>x!==k);
   else S.cats=[...S.cats,k];
   if(!S.cats.length) S.cats=Object.keys(CATS);
   save(); VIEWS[S.tab](); break; }
  case "say": speak(cur[0]); break;
  case "again": answer(false); break;
  case "know": answer(true); break;
  case "sayq": if(qa) speak(qa.item[0]); break;
  case "opt": chooseQ(i); break;
  case "nextq": refreshChips(); nextQ(); break;
  case "sit": S.sit=el.dataset.s; save(); viewSaetze(); break;
  case "sayp": speak(P[S.sit][i][0]); break;
  case "slowp": speak(P[S.sit][i][0],true); break;
  case "vopt": chooseV(i); break;
  case "nextv": nextV(); break;
  case "open": openSheet(true); break;
  case "close": openSheet(false); break;
  case "auto": S.auto=!S.auto; save(); el.setAttribute("aria-checked",S.auto); break;
  case "test": speak("Olá, tudo bem?"); break;
  case "banner": bannerClosed=true; store.set("bannerClosed",true); renderVoice(); break;
  case "reset":
   if(!el.dataset.armed){ el.dataset.armed="1"; el.textContent="Nochmal tippen zum Löschen"; }
   else { S.box={}; S.today={d:todayKey(),right:0,total:0}; save(); renderStat(); openSheet(false); VIEWS[S.tab](); }
   break;
 }
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape") openSheet(false);
 const el=e.target;
 if((e.key==="Enter"||e.key===" ") && el.classList && el.classList.contains("ph")){ e.preventDefault(); el.click(); }
 if(/^[1-4]$/.test(e.key) && !$("sheet").classList.contains("open")){
  const n=+e.key-1;
  if(S.tab==="quiz") chooseQ(n); else if(S.tab==="verben") chooseV(n);
 }
});

/* ---------- Start ---------- */
renderStat();
if("speechSynthesis" in window){
 loadVoices();
 try{ speechSynthesis.addEventListener("voiceschanged",()=>loadVoices()); }catch(e){ speechSynthesis.onvoiceschanged=()=>loadVoices(); }
 setTimeout(()=>loadVoices(true),2500);
} else { voiceState="unsupported"; renderVoice(); }
setTab(S.tab);
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
 window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
